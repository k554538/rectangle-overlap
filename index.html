<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中3数学｜動く長方形と重なる面積（改良版・軸拡張）</title><style>body{font-family:system-ui,'Yu Gothic',sans-serif;margin:0;background:#f4f7fb;color:#17253a}main{max-width:1100px;margin:auto;padding:22px}h1{font-size:clamp(22px,3vw,32px);margin:0 0 8px}.sub{color:#526477;margin-bottom:18px}.panel{background:white;border:1px solid #dbe3ed;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 3px 12px #1d38500c}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.stat{font-size:24px;font-weight:800;color:#1464bd}.stats{display:flex;gap:25px;flex-wrap:wrap}svg{width:100%;height:auto;display:block}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}button{background:#1768c1;border:0;color:white;border-radius:10px;padding:11px 18px;font-size:16px;font-weight:700;cursor:pointer}button.secondary{background:#e9f0f8;color:#17436f}input[type=range]{flex:1;min-width:180px;accent-color:#1768c1}label{font-weight:700}.legend{font-size:14px;color:#526477}.note{background:#edf5ff;padding:12px 15px;border-radius:10px;line-height:1.7}#phase{font-weight:700;color:#155eab} .toggles{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px} .toggles label{font-weight:500} .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.grid{grid-template-columns:1fr}main{padding:10px}.panel{padding:12px}}.tick{font-size:13px;fill:#526477}.line{stroke:#17253a;stroke-width:2}.small{font-size:15px;fill:#17253a}.point{fill:#17253a;font-size:16px;font-weight:700}</style></head><body><main><h1>動く長方形と重なる部分の面積</h1><div class="sub">中学3年 数学・統一テスト 大問3 ｜ ABCD：8cm × 4cm ／ PQRS：6cm × 6cm ／ 左へ毎秒1cm</div><section class="panel"><div class="top"><strong>① 図形の動き</strong><div class="stats"><div>時刻 <span id="time" class="stat">0.0</span> 秒</div><div>面積 <span id="area" class="stat">0.0</span> cm²</div></div></div><svg id="scene" viewBox="0 0 950 300" role="img" aria-label="2つの長方形の重なりを表示"><defs><pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#f59e0b" stroke-width="3" opacity=".25"/></pattern></defs><line x1="45" y1="250" x2="915" y2="250" stroke="#596b80" stroke-width="2"/><text x="917" y="257" class="small">ℓ</text><g id="moving"><rect x="0" y="0" width="240" height="240" fill="#4c9ce8" fill-opacity=".14" stroke="#1768c1" stroke-width="3"/><text x="8" y="-9" class="point">P</text><text x="247" y="-9" class="point">S</text><text x="8" y="258" class="point">Q</text><text x="247" y="258" class="point">R</text></g><rect id="fixed" x="0" y="0" width="320" height="160" fill="#38a169" fill-opacity=".12" stroke="#13804d" stroke-width="3"/><rect id="overlap" fill="#f5a623" fill-opacity=".70" stroke="#d97706" stroke-width="1.5"/><g id="fixedLabels" class="point"><text id="A">A</text><text id="B">B</text><text id="C">C</text><text id="D">D</text></g><text x="55" y="25" font-size="14" fill="#526477">緑：固定された長方形　青：動く正方形　橙：重なる部分</text></svg><div class="controls"><button id="play">▶ 再生</button><button id="reset" class="secondary">↺ 最初から</button><label for="slider">時刻</label><input id="slider" type="range" min="0" max="14" step="0.05" value="0"><span id="rangeValue">0.0 / 14秒</span></div><div class="toggles"><label><input id="showOverlap" type="checkbox" checked> 重なる部分を色で表示</label><label><input id="showGraph" type="checkbox" checked> グラフの軌跡を表示</label><label>再生速度 <select id="speed"><option value="0.5">0.5倍</option><option value="1" selected>1倍</option><option value="2">2倍</option><option value="3">3倍</option></select></label></div></section><div class="grid"><section class="panel"><strong>② 面積の変化をグラフで確認</strong><svg viewBox="0 0 500 335" role="img" aria-label="時間と重なり面積のグラフ"><g id="grid"></g><line id="target17" x1="52" y1="117" x2="458" y2="117" stroke="#d63b69" stroke-width="3" stroke-dasharray="9 5" style="display:none"/><text id="target17Label" x="452" y="109" text-anchor="end" fill="#bd2453" font-size="16" font-weight="bold" style="display:none">y = 17</text><polyline id="trace" fill="none" stroke="#e28b16" stroke-width="4" stroke-linejoin="round"/><circle id="dot" r="7" fill="#d97706" stroke="white" stroke-width="2"/><text id="dotLabel" font-size="15" font-weight="700" fill="#a45307"></text></svg><div class="legend">横軸：時間 x（秒）　縦軸：重なる面積 y（cm²）</div><div class="toggles"><label><input id="show17" type="checkbox"> y = 17 の直線を表示する</label></div></section><section class="panel"><strong>③ 今はどの場面？</strong><p id="phase" style="font-size:20px"></p><p id="explain" style="line-height:1.9"></p><div class="note"><strong>授業での問い</strong><div>「面積が増えなくなるのは何秒後？」</div><div>「面積が減り始めるのは何秒後？」</div><div>「同じ面積になる時刻は2つある？」</div></div><div class="controls" style="margin-top:16px"><button class="secondary" data-t="6">6秒へ</button><button class="secondary" data-t="8">8秒へ</button><button class="secondary" data-t="14">14秒へ</button></div></section></div></main><script>const $=id=>document.getElementById(id);let t=0,playing=false,last=0;const px=40,origin=230,base=250;const fixedX=origin, fixedY=base-4*px;const grid=$('grid');function el(tag,attrs,text){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;return e}for(let i=0;i<=16;i+=1){let x=52+i*(406/16);grid.append(el('line',{x1:x,y1:25,x2:x,y2:287,stroke:'#e0e7ef'}),el('text',{x,y:306,'text-anchor':'middle',class:'tick'},i))}for(let i=0;i<=26;i+=2){let y=287-i*10;grid.append(el('line',{x1:52,y1:y,x2:458,y2:y,stroke:'#e0e7ef'}),el('text',{x:42,y:y+5,'text-anchor':'end',class:'tick'},i))}grid.append(el('line',{x1:52,y1:25,x2:52,y2:287,stroke:'#17253a','stroke-width':2}),el('line',{x1:52,y1:287,x2:460,y2:287,stroke:'#17253a','stroke-width':2}));const area=t=>4*Math.max(0,Math.min(8,14-t)-Math.max(0,8-t));function update(v){t=Math.max(0,Math.min(14,Number(v)));const q=origin+(8-t)*px;const r=q+6*px;$('moving').setAttribute('transform',`translate(${q} ${base-6*px})`);$('fixed').setAttribute('x',fixedX);$('fixed').setAttribute('y',fixedY);const left=Math.max(origin,q),right=Math.min(origin+8*px,r);$('overlap').setAttribute('x',left);$('overlap').setAttribute('y',fixedY);$('overlap').setAttribute('width',Math.max(0,right-left));$('overlap').setAttribute('height',4*px);$('overlap').style.display=$('showOverlap').checked?'':'none';for(const [id,x,y] of [['A',origin-14,fixedY-8],['B',origin-14,base+18],['C',origin+8*px+5,base+18],['D',origin+8*px+5,fixedY-8]]){$(id).setAttribute('x',x);$(id).setAttribute('y',y)}$('time').textContent=t.toFixed(1);$('area').textContent=area(t).toFixed(1);$('slider').value=t;$('rangeValue').textContent=`${t.toFixed(1)} / 14秒`;const points=[];for(let s=0;s<=t+0.0001;s+=0.1)points.push(`${52+s*(406/16)},${287-area(s)*10}`);points.push(`${52+t*(406/16)},${287-area(t)*10}`);$('trace').setAttribute('points',points.join(' '));$('trace').style.display=$('showGraph').checked?'':'none';$('target17').style.display=$('show17').checked?'':'none';$('target17Label').style.display=$('show17').checked?'':'none';$('dot').setAttribute('cx',52+t*(406/16));$('dot').setAttribute('cy',287-area(t)*10);$('dotLabel').setAttribute('x',Math.min(410,58+t*29));$('dotLabel').setAttribute('y',Math.max(18,278-area(t)*10));$('dotLabel').textContent=`(${t.toFixed(1)}, ${area(t).toFixed(1)})`;if(t<6-0.0001){$('phase').textContent='面積が増える（0〜6秒）';$('explain').innerHTML='重なる部分の横の長さは <b>x cm</b>。<br>縦は4cmなので <b>y = 4x</b>。'}else if(t<=8+0.0001){$('phase').textContent='面積が一定（6〜8秒）';$('explain').innerHTML='正方形の横幅6cmが、長方形の中にすべて入っています。<br>したがって <b>y = 4×6 = 24</b>。'}else{$('phase').textContent='面積が減る（8〜14秒）';$('explain').innerHTML='重なる部分の横の長さは <b>(14−x) cm</b>。<br>したがって <b>y = 4(14−x)</b>。'}}function stop(){playing=false;$('play').textContent='▶ 再生'}$('slider').addEventListener('input',e=>{stop();update(e.target.value)});$('play').onclick=()=>{if(playing){stop();return}if(t>=14)update(0);playing=true;last=0;$('play').textContent='⏸ 一時停止';requestAnimationFrame(frame)};function frame(now){if(!playing)return;if(last)update(t+Math.min(.1,(now-last)/1000)*Number($('speed').value));last=now;if(t>=14){stop();return}requestAnimationFrame(frame)}$('reset').onclick=()=>{stop();update(0)};document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{stop();update(b.dataset.t)});$('showOverlap').onchange=()=>update(t);$('showGraph').onchange=()=>update(t);$('show17').onchange=()=>update(t);update(0);</script></body></html>
